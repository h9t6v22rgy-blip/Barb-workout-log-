<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark only">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tactical Log">
  <title>24-Week Tactical Workout Logger</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 130px; /* Ensures page content isn't obscured by the persistent timer */
    }

    header {
      position: sticky;
      top: 0;
      background-color: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      padding: 16px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .selector-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent-blue);
    }

    /* Standard Card */
    .exercise-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    /* Superset Container Styling */
    .superset-card {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-purple);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
    }

    .superset-badge {
      display: inline-block;
      background-color: var(--accent-purple);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .superset-divider {
      border-bottom: 1px dashed var(--border-color);
      margin: 14px 0;
    }

    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .exercise-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .target-info {
      font-size: 0.85rem;
      color: var(--accent-amber);
    }

    .set-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .set-label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .check-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      color: var(--accent-green);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .check-btn.completed {
      background-color: var(--accent-green);
      color: var(--bg-dark);
    }

    .superset-rest-container {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    .btn-superset-rest {
      background-color: var(--accent-purple);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
    }

    /* Fixed Bottom Rest Timer - Always Visible */
    .timer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 2px solid var(--accent-blue);
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 9999;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    .timer-display {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: monospace;
      color: var(--accent-blue);
    }

    .btn {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: var(--bg-dark);
    }

    .btn-secondary {
      background-color: var(--border-color);
      color: var(--text-main);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>TACTICAL LOG</h1>
    <span id="save-status" style="font-size: 0.8rem; color: var(--accent-green); opacity: 0.5;">Saved</span>
  </header>

  <div class="container">
    <div class="selector-card">
      <label for="week-select">Training Cycle</label>
      <select id="week-select" onchange="loadWorkout()">
        <!-- Generated via JS -->
      </select>

      <label for="day-select">Session</label>
      <select id="day-select" onchange="loadWorkout()">
        <option value="Day 1">Day 1: Upper Power</option>
        <option value="Day 2">Day 2: Lower Power</option>
        <option value="Day 3">Day 3: Conditioning / Core</option>
        <option value="Day 4">Day 4: Upper Hypertrophy (Supersets)</option>
        <option value="Day 5">Day 5: Lower Hypertrophy (Supersets)</option>
        <option value="Day 6">Day 6: Tactical Capacity</option>
        <option value="Day 7">Day 7: Active Recovery</option>
      </select>
    </div>

    <div id="exercise-list">
      <!-- Dynamic Exercises Rendered Here -->
    </div>

    <div class="action-grid">
      <button class="btn btn-secondary" onclick="exportData()">Export Backup</button>
      <button class="btn btn-secondary" onclick="importData()">Import Data</button>
    </div>
  </div>

  <!-- Persistent Bottom Rest Timer -->
  <div class="timer-bar">
    <div>
      <span style="font-size: 0.75rem; color: var(--text-muted); display: block; letter-spacing: 0.5px;">REST TIMER</span>
      <span class="timer-display" id="timer">01:30</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <button class="btn btn-secondary" onclick="startTimer(60)">60s</button>
      <button class="btn btn-primary" onclick="startTimer(90)">90s</button>
      <button class="btn btn-secondary" onclick="startTimer(120)">120s</button>
      <button class="btn btn-secondary" style="background-color: #ef4444; color: white;" onclick="resetTimer()">Stop</button>
    </div>
  </div>

  <script>
    let timerInterval = null;
    let defaultRestDuration = 90;

    // Initialize Weeks (1 to 24)
    const weekSelect = document.getElementById('week-select');
    for (let i = 1; i <= 24; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `Week ${i}${i % 4 === 0 ? ' (Deload Week)' : ''}`;
      weekSelect.appendChild(opt);
    }

    function loadWorkout() {
      const week = weekSelect.value;
      const day = document.getElementById('day-select').value;
      const list = document.getElementById('exercise-list');
      list.innerHTML = '';

      const isDeload = (week % 4 === 0);
      const targetSets = isDeload ? 2 : 4;

      const workoutTemplates = {
        'Day 1': ['Bench Press', 'Weighted Pull-Ups', 'Overhead Press', 'Barbell Rows'],
        'Day 2': ['Squats', 'Romanian Deadlifts', 'Leg Press', 'Calf Raises'],
        'Day 3': ['Zone 2 Ruck / Run', 'Plank Variations', 'Hanging Leg Raises'],
        'Day 4': [
          'Bench Press',
          { type: 'superset', name: 'Superset A', exercises: ['Incline Dumbbell Press', 'Lat Pulldowns'], rest: 90 },
          { type: 'superset', name: 'Superset B', exercises: ['Dumbbell Lateral Raises', 'Bicep Curls'], rest: 60 }
        ],
        'Day 5': [
          { type: 'superset', name: 'Superset A', exercises: ['Zercher Squats', 'Plate-Loaded Belt Squats'], rest: 120 },
          'Hamstring Curls', 
          'Ab Rollouts'
        ],
        'Day 6': ['Kettlebell Swings', 'Farmer Carries', 'Sandbag Gets-Ups'],
        'Day 7': ['Mobility Work', 'Light Walking', 'Stretching']
      };

      const blocks = workoutTemplates[day] || ['Main Lift', 'Accessory 1', 'Accessory 2'];

      blocks.forEach((item, blockIndex) => {
        // Render Superset Block
        if (typeof item === 'object' && item.type === 'superset') {
          const card = document.createElement('div');
          card.className = 'superset-card';

          let supersetHTML = `<div class="superset-badge">⚡ ${item.name.toUpperCase()} (SUPERSET)</div>`;

          item.exercises.forEach((exName, exIndex) => {
            if (exIndex > 0) supersetHTML += `<div class="superset-divider"></div>`;

            let setsHTML = '';
            for (let s = 1; s <= targetSets; s++) {
              const key = `w${week}_d${day}_b${blockIndex}_e${exIndex}_s${s}`;
              const savedData = JSON.parse(localStorage.getItem(key) || '{}');

              setsHTML += `
                <div class="set-row">
                  <span class="set-label">Set ${s}</span>
                  <input type="number" placeholder="lbs" value="${savedData.weight || ''}" onchange="saveSet('${key}', 'weight', this.value)">
                  <input type="number" placeholder="reps" value="${savedData.reps || ''}" onchange="saveSet('${key}', 'reps', this.value)">
                  <!-- Individual superset sets do not trigger rest automatically -->
                  <button class="check-btn ${savedData.done ? 'completed' : ''}" onclick="toggleSet(this, '${key}', false)">✓</button>
                </div>
              `;
            }

            supersetHTML += `
              <div class="exercise-header">
                <span class="exercise-title">${exName}</span>
                <span class="target-info">${isDeload ? 'Deload: 2 Sets' : '4 Sets'}</span>
              </div>
              ${setsHTML}
            `;
          });

          // Single rest timer trigger for the full superset block
          const restTime = item.rest || defaultRestDuration;
          supersetHTML += `
            <div class="superset-rest-container">
              <button class="btn-superset-rest" onclick="startTimer(${restTime})">Start Superset Rest (${restTime}s)</button>
            </div>
          `;

          card.innerHTML = supersetHTML;
          list.appendChild(card);
        } 
        // Render Standard Lift Block
        else {
          const card = document.createElement('div');
          card.className = 'exercise-card';

          let setsHTML = '';
          for (let s = 1; s <= targetSets; s++) {
            const key = `w${week}_d${day}_b${blockIndex}_s${s}`;
            const savedData = JSON.parse(localStorage.getItem(key) || '{}');

            setsHTML += `
              <div class="set-row">
                <span class="set-label">Set ${s}</span>
                <input type="number" placeholder="lbs" value="${savedData.weight || ''}" onchange="saveSet('${key}', 'weight', this.value)">
                <input type="number" placeholder="reps" value="${savedData.reps || ''}" onchange="saveSet('${key}', 'reps', this.value)">
                <!-- Single exercises auto-trigger default rest when checked -->
                <button class="check-btn ${savedData.done ? 'completed' : ''}" onclick="toggleSet(this, '${key}', true)">✓</button>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="exercise-header">
              <span class="exercise-title">${item}</span>
              <span class="target-info">${isDeload ? 'Deload: 2 Sets' : '4 Sets'}</span>
            </div>
            ${setsHTML}
          `;
          list.appendChild(card);
        }
      });
    }

    function saveSet(key, field, val) {
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      data[field] = val;
      localStorage.setItem(key, JSON.stringify(data));
      flashSaveStatus();
    }

    function toggleSet(btn, key, autoTimer) {
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      data.done = !data.done;
      localStorage.setItem(key, JSON.stringify(data));
      btn.classList.toggle('completed', data.done);

      if (data.done && autoTimer) {
        startTimer(defaultRestDuration);
      }
      
      flashSaveStatus();
    }

    function flashSaveStatus() {
      const status = document.getElementById('save-status');
      status.style.opacity = '1';
      setTimeout(() => { status.style.opacity = '0.5'; }, 1000);
    }

    // Timer Controls - Autostarts and populates duration
    function startTimer(seconds) {
      clearInterval(timerInterval);
      let remaining = seconds;
      updateTimerDisplay(remaining);

      timerInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(timerInterval);
          updateTimerDisplay(0);
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        } else {
          updateTimerDisplay(remaining);
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay(defaultRestDuration);
    }

    function updateTimerDisplay(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }

    // Backup & Restore
    function exportData() {
      const data = JSON.stringify(localStorage);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tactical_workout_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = event => {
          const data = JSON.parse(event.target.result);
          Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));
          loadWorkout();
          alert('Workout logs imported successfully!');
        };
        reader.readAsText(file);
      };
      input.click();
    }

    loadWorkout();
  </script>
</body>
</html>
