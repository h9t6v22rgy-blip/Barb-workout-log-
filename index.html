  <style>

      padding: 0;

    }
    
    html, body {

      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .day-tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
    .day-tab { flex: 1; min-width: 65px; padding: 10px 4px; background-color: #1e293b !important; border: 1px solid #334155 !important; color: #94a3b8 !important; border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer; text-align: center; white-space: nowrap; }

      padding: 16px;
      padding-bottom: calc(90px + env(safe-area-inset-bottom)) !important;

    .exercise-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
    .exercise-title { font-size: 1.05rem; font-weight: 700; color: #f1f5f9 !important; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .target-badge { font-size: 0.75rem; font-weight: 700; color: #38bdf8 !important; background-color: #07364d !important; border: 1px solid #0284c7 !important; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    .rest-badge { font-size: 0.75rem; font-weight: 700; color: #a855f7 !important; background-color: #2e1065 !important; border: 1px solid #7e22ce !important; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    .superset-badge { font-size: 0.75rem; font-weight: 800; color: #f472b6 !important; background-color: #500724 !important; border: 1px solid #9d174d !important; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    .superset-pass-badge { font-size: 0.75rem; font-weight: 700; color: #94a3b8 !important; background-color: #0f172a !important; border: 1px dashed #475569 !important; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    .deload-badge { font-size: 0.75rem; font-weight: 700; color: #fbbf24 !important; background-color: #451a03 !important; border: 1px solid #b45309 !important; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    
    /* Weight Intensity Badges */

    .weight-badge.heavy { color: #ef4444 !important; background-color: #450a0a !important; border: 1px solid #991b1b !important; }
    .weight-badge.moderate { color: #f59e0b !important; background-color: #451a03 !important; border: 1px solid #b45309 !important; }
    .weight-badge.light { color: #10b981 !important; background-color: #064e3b !important; border: 1px solid #047857 !important; }

    .notes-box { font-size: 0.78rem; color: #94a3b8 !important; background-color: #0f172a !important; padding: 6px 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #1e293b !important; }
    .set-row { display: grid; grid-template-columns: 50px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 8px; background-color: #152035 !important; padding: 6px 8px; border-radius: 6px; }

    .warmup-checkbox { width: 22px; height: 22px; accent-color: #3b82f6; cursor: pointer; }
    .warmup-text { font-size: 0.95rem; font-weight: 600; color: #f1f5f9 !important; }

    .prev-badge { font-size: 0.75rem; color: #93c5fd !important; background-color: #172554 !important; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; }
    .card-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn-timer-start { flex: 1; background-color: #2e1065 !important; border: 1px solid #7e22ce !important; color: #c084fc !important; padding: 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-align: center; }
    .btn-timer-start:active { background-color: #581c87 !important; }
    .toggle-matrix-btn { flex: 1; background: transparent !important; border: 1px dashed #334155 !important; color: #94a3b8 !important; padding: 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .matrix-container { display: none; margin-top: 10px; overflow-x: auto; border-top: 1px solid #334155 !important; padding-top: 10px; }
    .matrix-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; color: #f8fafc !important; }

    .matrix-table th { background-color: #0f172a !important; color: #94a3b8 !important; }

    /* ABSOLUTE/FIXED DOCKED TIMER FOR MOBILE SAFARI */
    #timerBar { 
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100% !important;
      max-width: 600px;
      margin: 0 auto;
      background-color: #090d16 !important; 
      border-top: 3px solid #a855f7 !important; 
      padding: 10px 16px; 
      padding-bottom: max(12px, env(safe-area-inset-bottom)) !important; 
      z-index: 999999 !important; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      box-shadow: 0 -8px 25px rgba(0,0,0,0.9); 
      -webkit-transform: translate3d(0,0,0);
      transform: translate3d(0,0,0);
    }
    
    #timerBar.pulse {
      transform: scale(1.02) translate3d(0,0,0);
    }

    .timer-inner {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #timerDisplay { font-size: 1.6rem; font-weight: 800; color: #c084fc !important; font-family: monospace; letter-spacing: 1px; }
    .timer-controls { display: flex; gap: 8px; }
    .btn-timer-ctrl { background-color: #1e293b !important; border: 1px solid #334155 !important; color: #f8fafc !important; padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
    .btn-timer-ctrl:active { background-color: #334155 !important; }
  </style>
</head>

let store = {};

let timerInterval = null;

  } catch (e) {

}

  try {
    localStorage.setItem("workout_db", JSON.stringify(store));
  } catch (e) {}
}

function updateVal(exName, setIdx, field, val) {
  const key = `W${currentWeek}_${currentDay}_${exName}`;
  if (!store[key]) store[key] = {};
  if (!store[key][setIdx]) store[key][setIdx] = { weight: "", reps: "" };
  store[key][setIdx][field] = val;
  saveStore();
}

function updateWarmupState(exName, completed) {
  const key = `W${currentWeek}_${currentDay}_${exName}`;
  if (!store[key]) store[key] = {};
  store[key].completed = completed;
  saveStore();
}

/* Rest Timer Functionality */
function startRestTimer(seconds) {
  if (seconds <= 0) return;
  clearInterval(timerInterval);
  timerSecondsRemaining = seconds;
  timerIsRunning = true;
  updateTimerDisplay();
  
  const toggleBtn = document.getElementById("btnTimerToggle");
  if (toggleBtn) toggleBtn.innerText = "Pause";

  const timerBar = document.getElementById("timerBar");
  if (timerBar) {
    timerBar.classList.add("pulse");
    setTimeout(() => timerBar.classList.remove("pulse"), 200);
  }

  timerInterval = setInterval(() => {
    if (timerIsRunning) {
      timerSecondsRemaining--;
      if (timerSecondsRemaining <= 0) {
        clearInterval(timerInterval);
        timerIsRunning = false;
        timerSecondsRemaining = 0;
        triggerTimerAlert();
      }
      updateTimerDisplay();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const disp = document.getElementById("timerDisplay");
  if (!disp) return;
  const mins = Math.floor(timerSecondsRemaining / 60);
  const secs = timerSecondsRemaining % 60;
  disp.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function triggerTimerAlert() {
  if ("vibrate" in navigator) {
    navigator.vibrate([200, 100, 200, 100, 400]);
  }
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
  } catch(e) {}
}

function toggleTimer() {
  if (timerSecondsRemaining <= 0) return;
  timerIsRunning = !timerIsRunning;
  const toggleBtn = document.getElementById("btnTimerToggle");
  if (toggleBtn) toggleBtn.innerText = timerIsRunning ? "Pause" : "Resume";
}

function resetTimer() {
  clearInterval(timerInterval);
  timerIsRunning = false;
  timerSecondsRemaining = 0;
  updateTimerDisplay();
  const toggleBtn = document.getElementById("btnTimerToggle");
  if (toggleBtn) toggleBtn.innerText = "Pause";
}

function toggleMatrix(matrixContainerId, exName, defaultSets) {
  const container = document.getElementById(matrixContainerId);
  if (!container) return;

  if (container.style.display === "block") {
    container.style.display = "none";
    return;
  }

  let rows = "";
  for (let w = 1; w <= 24; w++) {
    const wKey = `W${w}_${currentDay}_${exName}`;
    const isMatrixDeload = w % 4 === 0;
    const totalSets = isMatrixDeload ? Math.max(1, Math.ceil(defaultSets / 2)) : defaultSets;
    let rowStr = [];
    for (let s = 0; s < totalSets; s++) {
      const d = store[wKey]?.[s];
      if (d && (d.weight || d.reps)) {
        rowStr.push(`${d.weight || 0}x${d.reps || 0}`);
      }
    }
    if (rowStr.length > 0) {
      rows += `<tr><td>W${w}${isMatrixDeload ? ' (DL)' : ''}</td><td>${rowStr.join(", ")}</td></tr>`;
    }
  }
  container.querySelector('tbody').innerHTML = rows || '<tr><td colspan="2">No data logged yet</td></tr>';
  container.style.display = "block";
}

function getSupersetInfo(name) {
  const match = name.match(/^([A-Z])(\d+)\./i);
  if (!match) return { isSuperset: false };
  return {
    isSuperset: true,
    group: match[1].toUpperCase(),
    position: parseInt(match[2]),
    isFirst: match[2] === "1",
    isSecond: match[2] === "2"
  };
}

function renderApp() {
  const weekSelect = document.getElementById("weekSelect");
  if (weekSelect) {
    currentWeek = parseInt(weekSelect.value) || 1;
    localStorage.setItem("active_week", currentWeek);
  }
  const isDeloadWeek = currentWeek % 4 === 0;

  const appTitle = document.getElementById("appTitle");
  if (appTitle) {
    appTitle.innerHTML = isDeloadWeek 
      ? `24 Week Program <span style="color:#f59e0b !important; font-size:0.95rem;">(Week ${currentWeek} Deload)</span>` 
      : `24 Week Workout Program`;
  }

  const container = document.getElementById("exerciseList");
  if (!container) return;
  
  const fragment = document.createDocumentFragment();
  const exercises = routine[currentDay] || [];

  let lastSection = "";

  exercises.forEach((ex, exIdx) => {
    if (ex.section !== lastSection) {
      lastSection = ex.section;
      const sectionBanner = document.createElement("div");
      sectionBanner.className = "section-banner";
      sectionBanner.innerText = ex.section;
      fragment.appendChild(sectionBanner);
    }

    const supersetInfo = getSupersetInfo(ex.name);
    const card = document.createElement("div");
    card.className = `exercise-card ${supersetInfo.isSuperset ? 'superset-card' : ''}`;

    const isWarmup = ex.section.toUpperCase().includes("WARM-UP");

    if (isWarmup) {
      const key = `W${currentWeek}_${currentDay}_${ex.name}`;
      const isChecked = !!store[key]?.completed;

      const row = document.createElement("label");
      row.className = `warmup-row ${isChecked ? 'completed' : ''}`;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "warmup-checkbox";
      checkbox.checked = isChecked;

      checkbox.addEventListener("change", (e) => {
        const checked = e.target.checked;
        updateWarmupState(ex.name, checked);
        if (checked) {
          row.classList.add("completed");
        } else {
          row.classList.remove("completed");
        }
      });

      const text = document.createElement("span");
      text.className = "warmup-text";
      text.innerText = `${ex.name} — ${ex.target}`;

      row.appendChild(checkbox);
      row.appendChild(text);
      card.appendChild(row);

      if (ex.notes) {
        const notesDiv = document.createElement("div");
        notesDiv.className = "notes-box";
        notesDiv.style.marginTop = "8px";
        notesDiv.innerText = ex.notes;
        card.appendChild(notesDiv);
      }
    } else {
      const effectiveSets = isDeloadWeek ? Math.max(1, Math.ceil(ex.sets / 2)) : ex.sets;

      let setsContainer = document.createElement("div");
      const prevKey = `W${currentWeek - 1}_${currentDay}_${ex.name}`;
      const prevDataSet1 = currentWeek > 1 ? store[prevKey]?.[0] : null;

      if (prevDataSet1 && (prevDataSet1.weight || prevDataSet1.reps)) {
        const prevWt = parseFloat(prevDataSet1.weight) || 0;
        const prevBadge = document.createElement("div");
        prevBadge.className = "prev-badge";
        prevBadge.innerHTML = (isDeloadWeek && prevWt > 0)
          ? `W${currentWeek - 1} Weight: ${prevWt} lbs ➔ <b>Deload Target Weight (50%): ${Math.round((prevWt * 0.5) / 5) * 5} lbs</b>`
          : `Prev Week Set 1 Baseline: ${prevDataSet1.weight || 0} lbs × ${prevDataSet1.reps || 0} reps`;
        setsContainer.appendChild(prevBadge);
      }

      for (let s = 0; s < effectiveSets; s++) {
        const key = `W${currentWeek}_${currentDay}_${ex.name}`;
        const savedData = store[key]?.[s] || { weight: "", reps: "" };

        const setRow = document.createElement("div");
        setRow.className = "set-row";

        setRow.innerHTML = `
          <span class="set-label">Set ${s + 1}</span>
          <div class="input-group">
            <label>Lbs</label>
            <input type="number" inputmode="decimal" placeholder="0" class="input-w" data-ex="${ex.name}" data-set="${s}" value="${savedData.weight || ''}">
          </div>
          <div class="input-group">
            <label>Reps</label>
            <input type="number" inputmode="numeric" placeholder="0" class="input-r" data-ex="${ex.name}" data-set="${s}" value="${savedData.reps || ''}">
          </div>
        `;

        setsContainer.appendChild(setRow);
      }

      const matrixId = `matrix-${exIdx}`;
      const weightClass = ex.weightIntensity ? ex.weightIntensity.toLowerCase() : 'moderate';
      const headerDiv = document.createElement("div");
      headerDiv.className = "exercise-header";
      headerDiv.innerHTML = `
        <div class="exercise-title">${ex.name}</div>
        <div class="badges">
          ${supersetInfo.isSuperset ? `<div class="superset-badge">⚡ SUPERSET ${supersetInfo.group}</div>` : ''}
          ${isDeloadWeek ? `<div class="deload-badge">🔥 Deload (${effectiveSets} Sets)</div>` : ''}
          <div class="weight-badge ${weightClass}">${ex.weightIntensity || 'Moderate'}</div>
          <div class="target-badge">${ex.target}</div>
          ${ex.restLabel ? `<div class="rest-badge">⏱️ ${ex.restLabel}</div>` : ''}
        </div>
      `;

      card.appendChild(headerDiv);

      if (ex.notes) {
        const notesDiv = document.createElement("div");
        notesDiv.className = "notes-box";
        notesDiv.innerText = ex.notes;
        card.appendChild(notesDiv);
      }

      card.appendChild(setsContainer);

      const cardActions = document.createElement("div");
      cardActions.className = "card-actions";

      if (ex.restSec && ex.restSec > 0) {
        if (!supersetInfo.isSuperset || supersetInfo.isSecond) {
          const timerBtn = document.createElement("button");
          timerBtn.className = "btn-timer-start";
          timerBtn.innerText = supersetInfo.isSuperset
            ? `⏱️ Start Superset ${ex.restLabel || (ex.restSec + 's')} Rest`
            : `⏱️ Start ${ex.restLabel || (ex.restSec + 's')} Timer`;
          timerBtn.addEventListener("click", () => startRestTimer(ex.restSec));
          cardActions.appendChild(timerBtn);
        } else if (supersetInfo.isFirst) {
          const passBadge = document.createElement("div");
          passBadge.className = "superset-pass-badge";
          passBadge.innerText = `🔄 Move to ${supersetInfo.group}2 next`;
          cardActions.appendChild(passBadge);
        }
      }

      const toggleBtn = document.createElement("button");
      toggleBtn.className = "toggle-matrix-btn";
      toggleBtn.innerText = "📊 History";
      toggleBtn.addEventListener("click", () => toggleMatrix(matrixId, ex.name, ex.sets));
      cardActions.appendChild(toggleBtn);

      const matrixDiv = document.createElement("div");
      matrixDiv.id = matrixId;
      matrixDiv.className = "matrix-container";
      matrixDiv.innerHTML = `<table class="matrix-table"><thead><tr><th>Week</th><th>Logged Sets (Lbs x Reps)</th></tr></thead><tbody></tbody></table>`;

      card.appendChild(cardActions);
      card.appendChild(matrixDiv);
    }

    fragment.appendChild(card);
  });

  container.innerHTML = "";
  container.appendChild(fragment);
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store, null, 2));
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", `workout_backup_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(dlAnchorElem);
  dlAnchorElem.click();
  dlAnchorElem.remove();
}

function importData(e) {
  const fileReader = new FileReader();
  fileReader.onload = function(event) {
    try {
      const parsed = JSON.parse(event.target.result);
      if (parsed && typeof parsed === 'object') {
        store = parsed;
        saveStore();
        renderApp();
        alert("Backup imported successfully!");
      }
    } catch (err) {
      alert("Invalid JSON backup file.");
    }
  };
  if (e.target.files[0]) {
    fileReader.readAsText(e.target.files[0]);
  }
}

function init() {
  loadStore();
  
  const weekSelect = document.getElementById("weekSelect");
  if (weekSelect) {
    let opts = "";
    for (let w = 1; w <= 24; w++) {
      opts += `<option value="${w}">Week ${w}${w % 4 === 0 ? ' (Deload 🔄)' : ''}</option>`;
    }
    weekSelect.innerHTML = opts;
    weekSelect.value = currentWeek;
    weekSelect.addEventListener("change", renderApp);
  }

  const days = ["Day 1", "Day 2", "Day 3", "Day 4", "Day 5", "Day 6", "Day 7"];
  const dayTabs = document.getElementById("dayTabs");
  if (dayTabs) {
    dayTabs.innerHTML = days.map(day => 
      `<button class="day-tab ${day === currentDay ? 'active' : ''}">${day}</button>`
    ).join("");
    
    dayTabs.addEventListener("click", (e) => {
      if (e.target.classList.contains("day-tab")) {
        const selectedDayIndex = Array.from(dayTabs.children).indexOf(e.target);
        currentDay = days[selectedDayIndex];
        localStorage.setItem("active_day", currentDay);
        document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        renderApp();
      }
    });
  }

  // Event-delegation logging
  const container = document.getElementById("exerciseList");
  if (container) {
    container.addEventListener("input", (e) => {
      const target = e.target;
      if (target.matches('.input-w, .input-r')) {
        const exName = target.getAttribute('data-ex');
        const setIdx = parseInt(target.getAttribute('data-set'));
        const field = target.classList.contains('input-w') ? 'weight' : 'reps';
        if (exName !== null && !isNaN(setIdx)) {
          updateVal(exName, setIdx, field, target.value);
        }
      }
    });
  }

  const btnExport = document.getElementById("btnExport");
  const btnImport = document.getElementById("btnImport");
  const fileInput = document.getElementById("fileInput");

  if (btnExport) btnExport.addEventListener("click", exportData);
  if (btnImport && fileInput) {
    btnImport.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", importData);
  }

  const btnTimerToggle = document.getElementById("btnTimerToggle");
  const btnTimerReset = document.getElementById("btnTimerReset");
  if (btnTimerToggle) btnTimerToggle.addEventListener("click", toggleTimer);
  if (btnTimerReset) btnTimerReset.addEventListener("click", resetTimer);

  renderApp();
}

window.addEventListener('DOMContentLoaded', init);
</script>
